[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawfetch"
version = "0.2.1"
description = "Python SDK for ClawFetch — Web Intelligence API for AI Agents (x402-native)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["clawfetch", "x402", "web-intelligence", "ai-agents", "crypto", "usdc", "base"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0",
    "eth-account>=0.13.0",
    "eth-abi>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-mock>=3.15",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://api.clawfetch.ai"
Repository = "https://github.com/clawfetch/sdk-python"
